# AI-GENERATED: 태그를 서명·공증된 macOS 릴리스와 Homebrew Cask로 배포한다.
name: Release macOS

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Verify tag and release secrets
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          test "$PACKAGE_VERSION" = "$TAG_VERSION" || {
            echo "package.json version $PACKAGE_VERSION does not match tag $GITHUB_REF_NAME"
            exit 1
          }
          test -n "$HOMEBREW_TAP_TOKEN" || {
            echo "HOMEBREW_TAP_TOKEN is required to update leehosu/homebrew-tap"
            exit 1
          }
          test -n "$MACOS_CERTIFICATE" \
            -a -n "$MACOS_CERTIFICATE_PASSWORD" \
            -a -n "$APPLE_ID" \
            -a -n "$APPLE_APP_SPECIFIC_PASSWORD" \
            -a -n "$APPLE_TEAM_ID" || {
            echo "macOS signing and notarization secrets are required"
            exit 1
          }

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Build macOS Universal artifacts
        env:
          CSC_LINK: ${{ secrets.MACOS_CERTIFICATE }}
          CSC_KEY_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npm run build:mac

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" \
              dist/Pocketmon-Pet-*-universal.dmg \
              dist/Pocketmon-Pet-*-universal.zip \
              --clobber
          else
            gh release create "$GITHUB_REF_NAME" \
              dist/Pocketmon-Pet-*-universal.dmg \
              dist/Pocketmon-Pet-*-universal.zip \
              --generate-notes \
              --title "$GITHUB_REF_NAME"
          fi

      - name: Checkout Homebrew tap
        uses: actions/checkout@v4
        with:
          repository: leehosu/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap

      - name: Update Homebrew Cask
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p homebrew-tap/Casks
          node scripts/generate-homebrew-cask.mjs \
            "$TAG_VERSION" \
            "dist/Pocketmon-Pet-$TAG_VERSION-universal.dmg" \
            "homebrew-tap/Casks/pocketmon-pet.rb"
          cd homebrew-tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/pocketmon-pet.rb
          git diff --cached --quiet || git commit -m "chore: update pocketmon-pet to $TAG_VERSION"
          git push
