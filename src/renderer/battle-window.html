<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>포켓몬 배틀</title>
  <style>
    :root{
      color-scheme:light;
      --paper:#f8f8f0;
      --ink:#101010;
      --unit:3px;
      --balls:url('data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAACAAAAAIAgAAAAD3XrrSAAAAOklEQVR42mP4DwUMf/j/8J+N+bee4WPwB+ZPi3//ZjgWcoDhRuf7fwxHgYxbmkDGqRVQkU+LoWpgugCY/S0XiR35eAAAAABJRU5ErkJggg==');
    }
    *{box-sizing:border-box}
    html,body{width:100%;height:100%;margin:0;background:transparent;overflow:hidden}
    body{display:flex;align-items:center;justify-content:center;color:var(--ink);user-select:none;
      font-family:ui-monospace,SFMono-Regular,Menlo,monospace;-webkit-app-region:drag}
    button{font:inherit;-webkit-app-region:no-drag}

    /* AI-GENERATED: pret/pokegold의 20×18 타일(160×144) 좌표를 정확히 3배로 표시한다. */
    #screen{position:relative;width:480px;height:432px;overflow:hidden;background:var(--paper);
      box-shadow:0 0 0 3px var(--ink),0 8px 0 rgba(0,0,0,.35);image-rendering:pixelated}
    #battlefield{position:absolute;inset:0 0 144px;background:var(--paper)}

    .combatant{position:absolute;width:168px;height:168px}
    #enemy{left:288px;top:0}
    #player{left:24px;top:120px}
    .sprite{display:block;width:100%;height:100%;image-rendering:pixelated}
    #screen.player-front-fallback #player .sprite{transform:scaleX(-1)}
    #enemy.hit{animation:enemy-hit .36s steps(3,end)}
    #player.hit{animation:player-hit .36s steps(3,end)}
    .combatant.hit .sprite{animation:hit-flash .36s steps(2,end)}
    @keyframes enemy-hit{33%{transform:translateX(12px)}66%{transform:translateX(-9px)}}
    @keyframes player-hit{33%{transform:translateX(-12px)}66%{transform:translateX(9px)}}
    @keyframes hit-flash{50%{opacity:0}}

    /* 원본 HUD 좌표: 적 (1,0), 아군 (10,7), HP 바 (2,2)/(10,9). */
    .hpbox{position:absolute;z-index:2;background:transparent;font-size:21px;line-height:24px;font-weight:900}
    #enemy-box{left:24px;top:0;width:240px;height:96px}
    #player-box{left:240px;top:168px;width:240px;height:120px}
    .hpbox .name{position:absolute;left:0;top:0;max-width:198px;white-space:nowrap;overflow:hidden;text-overflow:clip}
    .hpbox .row{position:absolute;top:24px;font-size:18px;line-height:24px}
    #enemy-box .row{left:120px}#player-box .row{left:96px}
    .gauge{position:absolute;display:flex;align-items:center;height:24px}
    #enemy-box .gauge{left:24px;top:48px;width:192px}
    #player-box .gauge{left:0;top:48px;width:216px}
    .gauge .tag{width:48px;font-size:15px;letter-spacing:-1px}
    .bar{position:relative;flex:1;height:12px;border:3px solid var(--ink);background:var(--paper)}
    .bar>span{display:block;height:100%;width:100%;background:#48b84c;transition:width .3s steps(8,end)}
    .bar>span[data-tone="mid"]{background:#e8bc28}.bar>span[data-tone="low"]{background:#d84838}
    .hpnum{position:absolute;right:24px;top:72px;font-size:18px;line-height:24px;font-variant-numeric:tabular-nums}
    #enemy-box .hpnum{display:none}
    #player-box::after{content:'';position:absolute;right:0;bottom:20px;width:216px;height:72px;
      border-right:6px solid var(--ink);border-bottom:6px solid var(--ink);pointer-events:none}
    #enemy-box::after{content:'';position:absolute;left:0;top:48px;width:216px;height:36px;
      border-left:6px solid var(--ink);border-bottom:6px solid var(--ink);pointer-events:none}
    #expbar{position:absolute;right:0;top:102px;width:216px;height:6px;background:#d2a72e;border:0}
    .hpbox.hp-change{animation:hp-change .35s steps(2,end)}
    @keyframes hp-change{50%{opacity:.3}}

    #trainer-party{position:absolute;z-index:4;right:24px;top:24px;display:flex;flex-direction:row-reverse;gap:3px}
    #trainer-party[hidden]{display:none}
    /* pret/pokegold gfx/battle/balls.png 원본 타일. */
    .party-ball{width:24px;height:24px;background:var(--balls) 0 0/96px 24px no-repeat;image-rendering:pixelated}
    .party-ball.active{background-position:-24px 0}.party-ball.defeated{background-position:-48px 0}

    /* 원작 타일맵처럼 2px 선을 3배 정수 배율로 표시한다. 작은 타일 이미지를 늘리지 않는다. */
    .frame{background:var(--paper);border:6px solid var(--ink);box-shadow:inset 0 0 0 3px var(--paper)}
    #textbox{position:absolute;z-index:5;left:0;top:288px;width:480px;height:144px;padding:12px 15px;
      font-size:21px;line-height:30px;font-weight:900}
    #textbox.hidden{display:none}
    #cursor{position:absolute;right:18px;bottom:12px;font-size:18px;animation:blink .8s steps(1,end) infinite}
    @keyframes blink{50%{opacity:0}}

    /* 원본 BattleMenuHeader: menu_coords 8,12,19,17 / 2행×2열. */
    #command-menu{position:absolute;z-index:5;inset:288px 0 0;display:none;background:var(--paper)}
    #command-menu.open{display:block}
    #command-prompt{position:absolute;left:0;top:0;width:216px;height:144px;padding:30px 18px;
      font-size:18px;line-height:27px;font-weight:900;white-space:pre-line}
    #command-list{position:absolute;left:192px;top:0;width:288px;height:144px;padding:12px 9px;
      display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;align-items:center}
    .command{position:relative;border:0;background:transparent;color:var(--ink);font-size:20px;font-weight:900;text-align:left;padding-left:30px;cursor:pointer}
    .command::before{content:'▶';position:absolute;left:6px;opacity:0}
    .command:hover::before,.command:focus-visible::before{opacity:1}

    /* 원본 MoveSelectionScreen: 기술창 (4,12), 정보창 (0,8). */
    #menu{position:absolute;z-index:6;inset:0;display:none;pointer-events:none}
    #menu.open{display:block}
    #move-info{position:absolute;left:0;top:192px;width:264px;height:120px;padding:9px 12px;
      font-size:16px;line-height:24px;font-weight:900;pointer-events:auto}
    #move-info .kv{display:flex;justify-content:space-between}.power-row{display:none!important}
    #move-list{position:absolute;left:96px;top:288px;width:384px;height:144px;padding:10px 15px;
      display:grid;grid-template-columns:1fr;grid-template-rows:repeat(4,24px);align-content:center;pointer-events:auto}
    .move{position:relative;width:100%;height:24px;padding:0 0 0 27px;border:0;background:transparent;color:var(--ink);
      font-size:18px;line-height:24px;font-weight:900;text-align:left;cursor:pointer}
    .move::before{content:'▶';position:absolute;left:3px;opacity:0}
    .move:hover::before,.move:focus-visible::before{opacity:1}
    .move:disabled{opacity:.4;cursor:default}

    #transition{position:absolute;inset:0;z-index:20;pointer-events:none;display:none}
    #screen.intro #transition{display:block}
    #transition .flash{position:absolute;inset:0;animation:flash .45s steps(1,end) forwards}
    @keyframes flash{0%,15%,32.1%,49%,66.1%{background:#101010;opacity:1}15.1%,32%,49.1%,66%{background:#f8f8f0;opacity:1}83.1%,100%{opacity:0}}
    #transition .blinds{position:absolute;inset:0;display:flex;flex-direction:column}
    #transition .blinds i{flex:1;background:#101010;transform-origin:left;animation:blind .45s steps(6,end) .45s forwards}
    #transition .blinds i:nth-child(even){transform-origin:right}
    @keyframes blind{from{transform:scaleX(1)}to{transform:scaleX(0)}}
    #screen.intro #enemy{animation:slide-in-right .45s steps(6,end) .9s both}
    #screen.intro #player{animation:slide-in-left .45s steps(6,end) .9s both}
    #screen.trainer-intro :is(#enemy-box,#player-box){visibility:hidden}
    #screen.opponent-switch #enemy{animation:slide-in-right .45s steps(6,end) both}
    @keyframes slide-in-right{from{transform:translateX(192px)}to{transform:translateX(0)}}
    @keyframes slide-in-left{from{transform:translateX(-192px)}to{transform:translateX(0)}}

    #result{position:absolute;z-index:15;left:0;top:288px;width:480px;height:144px;padding:12px 15px;text-align:left}
    #result[hidden]{display:none}
    #result-title{font-size:21px;line-height:27px;font-weight:900}
    #result-xp{font-size:18px;line-height:24px;font-weight:900}
    #result-detail{font-size:15px;line-height:21px;font-weight:900}

    .damage{display:none}
    .chrome{display:none}
    @media(prefers-reduced-motion:reduce){
      .combatant.hit,.combatant.hit .sprite,.hpbox.hp-change,#cursor{animation:none}
      .bar>span{transition:none}#screen.intro #transition{display:none}
      #screen.intro #enemy,#screen.intro #player{animation:none}
    }
  </style>
</head>
<body>
  <button id="music" class="chrome" type="button" aria-pressed="true">♪</button>
  <button id="close" class="chrome" type="button">×</button>

  <main id="screen">
    <section id="battlefield">
      <section id="enemy" class="combatant"><canvas class="sprite" width="56" height="56"></canvas></section>
      <section id="player" class="combatant"><canvas class="sprite" width="56" height="56"></canvas></section>

      <div id="enemy-box" class="hpbox">
        <div class="name">포켓몬</div><div class="row"><span class="level">Lv.1</span></div>
        <div class="gauge"><span class="tag">HP:</span><div class="bar"><span></span></div></div><div class="hpnum"></div>
      </div>
      <div id="player-box" class="hpbox">
        <div class="name">포켓몬</div><div class="row"><span class="level">Lv.1</span></div>
        <div class="gauge"><span class="tag">HP:</span><div class="bar"><span></span></div></div><div class="hpnum">0/ 0</div>
        <div id="expbar"></div>
      </div>
      <div id="trainer-party" hidden aria-label="관장 포켓몬"></div>
    </section>

    <div id="textbox" class="frame"><div id="message">전투 준비</div><div id="cursor">▼</div></div>

    <section id="command-menu">
      <div id="command-prompt">포켓몬은<br>무엇을 할까?</div>
      <div id="command-list" class="frame">
        <button id="fight" class="command" type="button">FIGHT</button>
        <button id="party-command" class="command" type="button">PKMN</button>
        <button id="pack-command" class="command" type="button">PACK</button>
        <button id="run" class="command" type="button">RUN</button>
      </div>
    </section>

    <section id="menu">
      <div id="move-info" class="frame">
        <div class="kv"><span>TYPE/</span><b id="info-type">—</b></div>
        <div class="kv"><span>PP</span><b id="info-pp">—</b></div>
        <div class="kv power-row"><span>POWER</span><b id="info-power">—</b></div>
      </div>
      <div id="move-list" class="frame"></div>
    </section>

    <div id="transition" aria-hidden="true"><div class="flash"></div>
      <div class="blinds"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
    </div>
    <section id="result" class="frame" aria-live="assertive" hidden>
      <div id="result-title"></div><div id="result-xp"></div><div id="result-detail"></div>
    </section>
  </main>
  <script type="module" src="./battle-window.js"></script>
</body>
</html>
