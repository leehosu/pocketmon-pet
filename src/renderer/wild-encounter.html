<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>야생 포켓몬</title>
  <style>
    *{box-sizing:border-box}
    html,body{width:100%;height:100%;margin:0;background:transparent;overflow:hidden}
    body{user-select:none}
    #wild{width:100%;height:100%;border:0;padding:8px;background:transparent;cursor:pointer;-webkit-app-region:no-drag}
    #sprite{display:block;width:128px;height:128px;image-rendering:pixelated;
      filter:drop-shadow(0 7px 3px rgba(0,0,0,.35));animation:appear .5s steps(5,end),float 1.8s ease-in-out .5s infinite}
    #wild:hover #sprite{filter:drop-shadow(0 7px 3px rgba(0,0,0,.35)) brightness(1.1)}
    #wild:active #sprite{transform:translateY(3px)}
    @keyframes appear{0%{opacity:0;transform:translateX(48px)}100%{opacity:1;transform:translateX(0)}}
    @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
    @media(prefers-reduced-motion:reduce){#sprite{animation:none}}
  </style>
</head>
<body>
  <button id="wild" type="button" title="야생 포켓몬과 전투">
    <canvas id="sprite" width="128" height="128" aria-label="야생 포켓몬"></canvas>
  </button>
  <script type="module" src="./wild-encounter.js"></script>
</body>
</html>
