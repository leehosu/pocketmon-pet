<!doctype html>
<html>
<head><meta charset="utf-8"><style>
  html,body{margin:0;background:transparent!important;overflow:hidden;width:100%;height:100%;}
  #preview-bg{display:none;position:fixed;inset:0;background-color:#171b21;background-image:linear-gradient(45deg,#242a31 25%,transparent 25%),linear-gradient(-45deg,#242a31 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#242a31 75%),linear-gradient(-45deg,transparent 75%,#242a31 75%);background-size:24px 24px;background-position:0 0,0 12px,12px -12px,-12px 0}
  html.preview #preview-bg{display:block}
  canvas{position:relative;display:block;background:transparent!important;}
</style></head>
<body>
  <div id="preview-bg" aria-hidden="true"></div>
  <canvas id="fx"></canvas>
  <script type="module" src="./effect-overlay.js"></script>
</body>
</html>
