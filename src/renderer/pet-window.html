<!doctype html>
<html>
<head><meta charset="utf-8"><style>
  html,body{margin:0;background:transparent;overflow:hidden;width:100%;height:100%;}
  /* body가 창(Electron BrowserWindow) 크기를 채우도록 — 상세 패널로 창이 커질 때
     하드코딩 96px에 갇혀 패널이 잘리지 않게 한다. 스프라이트는 top-left 96×96 고정. */
  body{position:relative;}
  /* 네이티브 -webkit-app-region:drag에 기대지 않고 pet-window.js에서 수동 드래그로
     창을 옮긴다(그래야 캔버스 클릭=핀 토글이 드래그 히트테스트에 먹히지 않는다). */
  canvas{image-rendering:pixelated;position:absolute;top:0;left:0;-webkit-app-region:no-drag;cursor:grab;}
  #pop{
    position:absolute;top:2px;left:0;width:96px;text-align:center;
    font:bold 11px monospace;color:#fff;text-shadow:0 0 2px #000,0 0 2px #000;
    pointer-events:none;opacity:0;transition:opacity .2s ease;
  }
  /* 부화/진화 가능 "!" 배지 — 클릭 가능, 통통 튀는 펄스 */
  #alert{
    position:absolute;top:2px;right:6px;width:18px;height:18px;
    display:flex;align-items:center;justify-content:center;
    background:#f8c838;color:#1a1400;border:2px solid #1a1400;border-radius:50%;
    font:bold 13px monospace;cursor:pointer;
    -webkit-app-region:no-drag;pointer-events:auto;
    opacity:0;transition:opacity .2s ease;
    box-shadow:0 0 6px #f8c838;
    animation:alertpulse .8s ease-in-out infinite;
  }
  @keyframes alertpulse{
    0%,100%{transform:translateY(0) scale(1);}
    50%{transform:translateY(-3px) scale(1.15);}
  }
  @media (prefers-reduced-motion: reduce){ #alert{animation:none;} }
  #hud{
    position:absolute;left:0;bottom:0;width:96px;
    display:flex;flex-direction:column;align-items:center;gap:2px;
    padding-bottom:2px;
    opacity:0;transition:opacity .15s ease;
    -webkit-app-region:no-drag;
    pointer-events:none;
  }
  #xp-bar{
    width:84px;height:5px;background:rgba(0,0,0,.5);border:1px solid #0f0f0f;
  }
  #xp-fill{
    height:100%;width:0%;background:#f8c838;transition:width .3s ease;
  }
  #status{
    font:9px monospace;color:#fff;text-shadow:0 0 2px #000,0 0 2px #000;
    white-space:nowrap;
  }
  /* 더블클릭 상세 패널 (평상시 숨김; 열리면 메인이 창을 확장) */
  #detail{
    position:absolute;left:2px;top:98px;width:196px;
    box-sizing:border-box;padding:8px 10px;
    background:rgba(14,15,26,.92);border:1px solid #2c3050;border-radius:8px;
    color:#e8eaff;font:10px/1.5 monospace;
    opacity:0;transition:opacity .15s ease;pointer-events:none;
    -webkit-app-region:no-drag;
  }
  #detail .d-name{font-size:13px;font-weight:bold;margin-bottom:5px;color:#f8c838;}
  #detail .d-row{display:flex;justify-content:space-between;gap:8px;}
  #detail .d-row span{color:#9aa0c8;}
  #detail .d-row b{font-weight:600;text-align:right;}
  #detail .d-skills-label{margin-top:8px;margin-bottom:4px;color:#9aa0c8;font-size:9px;
    text-transform:uppercase;letter-spacing:.06em;border-top:1px solid #2c3050;padding-top:6px;}
  #detail .d-skills{display:flex;flex-wrap:wrap;gap:5px;}
  /* 버튼만 클릭 가능(#detail 자체는 pointer-events:none) */
  #detail .skill-btn{
    pointer-events:auto;-webkit-app-region:no-drag;cursor:pointer;
    font:10px monospace;color:#e8eaff;background:#1f2236;border:1px solid #2c3050;
    border-radius:6px;padding:5px 8px;transition:.12s;
  }
  #detail .skill-btn:hover{background:#f8c838;color:#1a1400;border-color:#f8c838;}
  #detail .skill-btn:active{transform:translateY(1px);}
</style></head>
<body>
  <canvas id="pet" width="96" height="96"></canvas>
  <div id="pop"></div>
  <div id="alert" title="">!</div>
  <div id="hud">
    <div id="xp-bar"><div id="xp-fill"></div></div>
    <div id="status"></div>
  </div>
  <div id="detail"></div>
  <script type="module" src="./pet-window.js"></script>
</body>
</html>
